name: WI air quality forecast watcher

on:
  schedule:
    # Hourly at :07, 6am-11pm Central (CDT = UTC-5, so UTC hours 11-23 and 0-4).
    # In winter (CST = UTC-6) this shifts an hour later; adjust if you care.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit last_forecast.txt back to the repo

concurrency:
  group: aqi-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::rvest
            any::blastula

      - name: Check forecast and email if changed
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional overrides if you don't use Gmail:
          # SMTP_HOST: smtp.example.com
          # SMTP_PORT: "465"
        run: Rscript check_forecast.R

      - name: Commit updated state
        run: |
          if [ -f last_forecast.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_forecast.txt
            git diff --cached --quiet || { git commit -m "Update last-seen forecast [skip ci]"; git push; }
          else
            echo "No state file this run (script skipped); nothing to commit."
          fi
